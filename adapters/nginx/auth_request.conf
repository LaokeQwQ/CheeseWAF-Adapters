# Include this location inside the NGINX server block that protects an
# upstream. The adapter intentionally receives metadata only; request bodies
# remain disabled until a policy explicitly opts in.
#
# This metadata-only hop cannot inspect request bodies. auth_request
# subrequests do not carry the client body to the upstream, and
# proxy_pass_request_body off guarantees the adapter never sees it. This file
# is not a PHP2Shell body-inspection control; use php2shell-njs.conf and
# php2shell-njs.md for bounded body inspection in the access phase.
# Do not describe auth_request as body inspection.
# Keep this hop on loopback/private networking. If it crosses a host or Pod
# boundary, use TLS/mTLS and configure CHEESEWAF_ADAPTER_TOKEN. The adapter
# only trusts forwarded headers from configured trusted proxy CIDRs.
location = /_cheesewaf_auth {
    internal;
    proxy_pass http://127.0.0.1:9080/nginx/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, rather than append, so a client-supplied XFF chain cannot
    # become the asserted client identity at the adapter.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # $request_id is available when NGINX request-id support is enabled. Omit
    # this line if it is unavailable; adapterd will generate an ID.
    proxy_set_header X-Request-ID $request_id;
    # Keep the subrequest within adapterd's budget; do not inherit the 60s
    # NGINX proxy defaults.
    proxy_connect_timeout 100ms;
    proxy_read_timeout 1s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # If CHEESEWAF_ADAPTER_TOKEN is configured, inject the dedicated
    # X-CheeseWAF-Adapter-Token from a secret-backed NGINX variable here.
}

# Add these directives at the protected location or server level.
#
# auth_request /_cheesewaf_auth;
#
# auth_request does not forward subrequest response headers to the client by
# default. Propagate the decision and challenge headers explicitly:
#
# auth_request_set $cheesewaf_decision $upstream_http_x_cheesewaf_decision;
# add_header X-CheeseWAF-Decision $cheesewaf_decision always;
# auth_request_set $cheesewaf_request_id $upstream_http_x_cheesewaf_request_id;
# add_header X-CheeseWAF-Request-ID $cheesewaf_request_id always;
# auth_request_set $cheesewaf_www_authenticate $upstream_http_www_authenticate;
# add_header WWW-Authenticate $cheesewaf_www_authenticate always;
# auth_request_set $cheesewaf_set_cookie $upstream_http_set_cookie;
# add_header Set-Cookie $cheesewaf_set_cookie always;
# auth_request_set $cheesewaf_location $upstream_http_location;
# add_header Location $cheesewaf_location always;
# auth_request_set $cheesewaf_retry_after $upstream_http_retry_after;
# add_header Retry-After $cheesewaf_retry_after always;
#
# auth_request only treats 2xx/401/403 as decisions; other upstream statuses
# become errors. Map adapter failures to an explicit 503 instead of a generic
# 500:
#
# error_page 500 502 504 = @cheesewaf_unavailable;
# location @cheesewaf_unavailable {
#     internal;
#     return 503;
# }
