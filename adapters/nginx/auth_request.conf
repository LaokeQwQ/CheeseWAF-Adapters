# Include this location inside the NGINX server block that protects an
# upstream. The adapter intentionally receives metadata only; request bodies
# remain disabled until a policy explicitly opts in.
# Keep this hop on loopback/private networking. If it crosses a host or Pod
# boundary, use TLS/mTLS and configure CHEESEWAF_ADAPTER_TOKEN. The adapter
# only trusts forwarded headers from configured trusted proxy CIDRs.
location = /_cheesewaf_auth {
    internal;
    proxy_pass http://127.0.0.1:9080/nginx/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, rather than append, so a client-supplied XFF chain cannot
    # become the asserted client identity at the adapter.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # $request_id is available when NGINX request-id support is enabled. Omit
    # this line if it is unavailable; adapterd will generate an ID.
    proxy_set_header X-Request-ID $request_id;
    # If CHEESEWAF_ADAPTER_TOKEN is configured, inject the dedicated
    # X-CheeseWAF-Adapter-Token from a secret-backed NGINX variable here.
}

# Add this directive at the protected location or server level.
# auth_request /_cheesewaf_auth;
