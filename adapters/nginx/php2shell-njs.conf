# NGINX njs body inspection for PHP2Shell.
#
# Requires njs >= 1.0.2. CVE-2026-18329 is fixed in 1.0.1, so 1.0.1 and
# earlier must not be deployed. js_access and the r.readRequest*() readers
# exist since 0.9.9, but that version is not an acceptable floor.
#
# This file is a reference snippet, not a single drop-in include: the lines
# below belong to different NGINX contexts. Copy each marked block into the
# matching context. Do not put a `load_module` line inside `http`.
#
# The handler only inspects POST, PUT, and PATCH bodies. It fails closed: an
# unavailable adapterd or a timeout returns 503 to the client.

# ---------------------------------------------------------------------------
# main context
# ---------------------------------------------------------------------------
# Path depends on the package. Adjust for your build:
#   Debian/Ubuntu: /usr/lib/nginx/modules/ngx_http_js_module.so
#   nginx.org:     /etc/nginx/modules/ngx_http_js_module.so
#   source build:  modules/ngx_http_js_module.so
# Omit this line when njs is compiled statically into NGINX.
load_module modules/ngx_http_js_module.so;

# Optional. Keep the adapter token in the inherited environment so the njs
# handler can attach X-CheeseWAF-Adapter-Token. Omit both lines when adapterd
# is loopback-only and no token is configured.
env CHEESEWAF_ADAPTER_TOKEN;

# ---------------------------------------------------------------------------
# http context
# ---------------------------------------------------------------------------
http {
    # Directory containing php2shell.js from this repository.
    js_path /etc/nginx/njs/;
    js_import php2shell from php2shell.js;

    # QuickJS is the supported engine for njs >= 1.0.
    js_engine qjs;

    # Bound ngx.fetch. adapterd has a 100ms inspection budget; this is a
    # transport bound, not a client-visible request budget. The handler also
    # applies $cheesewaf_body_check_timeout_ms as a whole-operation deadline.
    js_fetch_timeout 2s;
    js_fetch_max_response_buffer_size 8k;

    # Replace with the existing PHP upstream. Kept here so the snippet is
    # syntactically complete; do not route to this address in production.
    upstream php_backend {
        server 127.0.0.1:8081;
    }

    server {
        # Terminate TLS here or in front of this server. Add ssl_certificate
        # and ssl_certificate_key before exposing port 443.
        listen 80;
        server_name example.com;

        # ... existing TLS and upstream configuration ...

        location / {
            # Body inspection settings. The JS clamps both values and rejects
            # bodies above $cheesewaf_body_check_max_bytes before forwarding.
            # POST/PUT/PATCH bodies above this limit receive 413, including
            # otherwise legitimate large uploads. Raise this value and
            # client_max_body_size together when the site accepts them.
            set $cheesewaf_body_check_url http://127.0.0.1:9080/nginx/body-check;
            set $cheesewaf_body_check_max_bytes 65536;
            set $cheesewaf_body_check_timeout_ms 2000;

            # Keep the largest inspected body in memory so the access handler
            # can read it without spilling to a temp file. This MUST be at
            # least as large as $cheesewaf_body_check_max_bytes.
            client_body_buffer_size 128k;

            # Hard transport guard. Requests above this limit are rejected by
            # NGINX before the njs handler runs. Keep it small enough to bound
            # disk and memory, but larger than the inspection limit so the
            # handler can return a deterministic 413.
            client_max_body_size 1m;

            # Metadata-only auth_request (adapters/nginx/auth_request.conf)
            # may stay in front of this location. It cannot see the body and
            # does not replace this line.
            # auth_request /_cheesewaf_auth;

            js_access php2shell.check;

            # Leave request buffering on (the default). The body read by njs
            # is cached on the request and forwarded here unchanged.
            proxy_pass http://php_backend;
        }
    }
}
